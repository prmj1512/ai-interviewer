<!DOCTYPE html>
<html>
<head>
<title>AI Interviewer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
<div class="card p-4 shadow">

<h2 class="text-center">🎤 AI Interview Coach</h2>

<div class="d-flex justify-content-between mb-3">
<a href="/dashboard" class="btn btn-outline-primary">Dashboard</a>
<a href="/logout" class="btn btn-outline-danger">Logout</a>
</div>

<form method="POST">
<select name="category" class="form-select mb-3">
<option value="HR">HR</option>
<option value="DSA">DSA</option>
<option value="TECH">Tech</option>
</select>

<button class="btn btn-primary w-100 mb-3">Get Question</button>

<h5>{{ question }}</h5>

<textarea name="answer" id="output" class="form-control mb-3"></textarea>

<button class="btn btn-success w-100">Analyze</button>
</form>

<button onclick="startListening()" class="btn btn-dark w-100 mt-2">🎤 Speak</button>

<div class="mt-3">
<h5>Score: {{ score }}/100</h5>
<h6>Missing: {{ missing }}</h6>
<h6>Feedback: {{ feedback }}</h6>
</div>

</div>
</div>

<script>
function startListening() {
    const recognition = new webkitSpeechRecognition();
    recognition.onresult = function(event) {
        document.getElementById("output").value =
            event.results[0][0].transcript;
    };
    recognition.start();
}
</script>

</body>
</html>
